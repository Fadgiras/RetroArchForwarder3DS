name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # The patching routines carry no 3DS dependency on purpose, so they build and
  # run on a plain host. That is what catches a regression before hardware does.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the host harnesses
        run: |
          set -eu
          mkdir -p build-host
          gcc -O2 -Wall -o build-host/test_filter host/test_filter.c source/romfilter.c
          gcc -O2 -Wall -o build-host/test_sha    host/test_sha.c    source/sha256.c
          gcc -O2 -Wall -o build-host/test_scrub  host/test_scrub.c  source/romfilter.c
          gcc -O2 -w     -o build-host/test_icon   host/test_icon.c   source/icongen.c -lm
          gcc -O2 -w     -o build-host/test_banner host/test_banner.c source/bannergen.c source/icongen.c -lm
          gcc -O2 -w     -o build-host/test_patch  host/test_patch.c  source/cia_patch.c source/sha256.c

      # Only the self-contained ones run here. test_icon, test_banner and
      # test_patch need input files that are not in the repository; building
      # them still guards against a broken build.
      - name: Run the self-contained tests
        run: |
          set -eu
          ./build-host/test_filter
          ./build-host/test_sha
          ./build-host/test_scrub

  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          set -eu
          export DEVKITPRO=${DEVKITPRO:-/opt/devkitpro}
          export DEVKITARM=${DEVKITARM:-/opt/devkitpro/devkitARM}
          make

      - uses: actions/upload-artifact@v4
        with:
          name: fwdgen
          path: |
            fwdgen.3dsx
            fwdgen.smdh
          if-no-files-found: error

  release:
    needs: [tests, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fwdgen

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            fwdgen.3dsx
            fwdgen.smdh
          generate_release_notes: true
